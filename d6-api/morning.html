<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아침 대시보드</title>
<script>
  // ===== 🔌 이 화면이 쓰는 API (주소는 여기 한 곳에만) =====
  // 우리 동네를 바꾸려면 PLACE 이름과 weather·air 주소의 latitude, longitude 숫자를 바꿔요.
  const PLACE = "서울 중구 (서울시청)";
  const API = {
    weather: "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code,is_day&timezone=Asia%2FSeoul", // 🔌 1-1. Open-Meteo 날씨
    air: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.5665&longitude=126.9780&current=pm10,pm2_5&timezone=Asia%2FSeoul", // 🔌 1-2. Open-Meteo 대기질
    usd: "https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW", // 🔌 2-1. Frankfurter 1달러 → 원
    jpy: "https://api.frankfurter.dev/v1/latest?base=JPY&symbols=KRW&amount=100", // 🔌 2-2. Frankfurter 100엔 → 원
    holiday: "https://date.nager.at/api/v3/NextPublicHolidays/KR", // 🔌 3. Nager.Date 한국 다음 공휴일
    dog: "https://dog.ceo/api/breeds/image/random", // 🔌 4. Dog CEO 랜덤 강아지
  };
</script>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1d232a;
    --muted: #66717d;
    --line: #dde2e7;
    --accent: #2f6fdf;
    --error-bg: #fdecec;
    --error-text: #a52a2a;
    --good: #2f6fdf;
    --normal: #2e9d5b;
    --bad: #e08a00;
    --very-bad: #d33a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --card: #1e242b;
      --text: #e8ecf0;
      --muted: #9aa5b1;
      --line: #313a44;
      --accent: #7fa8f0;
      --error-bg: #3a2020;
      --error-text: #f3a6a6;
      --good: #7fa8f0;
      --normal: #5cc78a;
      --bad: #f0a830;
      --very-bad: #f07070;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  .greeting { font-size: 1.5rem; font-weight: 700; margin: 0; }
  .today { color: var(--muted); margin: 4px 0 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .card h2 { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  .big { font-size: 2.2rem; font-weight: 700; line-height: 1.2; }
  .line { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
  .line + .line { border-top: 1px solid var(--line); }
  .line strong { font-size: 1.15rem; }
  .grade { font-weight: 700; }
  .grade.good { color: var(--good); }
  .grade.normal { color: var(--normal); }
  .grade.bad { color: var(--bad); }
  .grade.very-bad { color: var(--very-bad); }
  .sub { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .basis { color: var(--muted); font-size: 0.8rem; margin: 10px 0 0; }
  .loading { color: var(--muted); margin: 0; }
  .error {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.9rem;
  }
  .error.small { padding: 8px 10px; font-size: 0.85rem; }
  .btn {
    margin-top: 8px;
    padding: 6px 14px;
    font: inherit;
    font-size: 0.9rem;
    border: 1px solid currentColor;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  .dog-img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 10px;
    background: var(--bg);
  }
  .dog-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .dog-row .btn { margin-top: 0; color: var(--accent); }
  .source { color: var(--muted); font-size: 0.85rem; margin: 20px 0 0; }
  .source a { color: var(--accent); }
  .api-box {
    margin-top: 28px;
    padding: 16px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    font-size: 0.85rem;
  }
  .api-box h2 { font-size: 0.95rem; margin: 0 0 8px; }
  .api-box ul { margin: 0; padding-left: 20px; }
  .api-box li { margin-bottom: 10px; }
  .api-box code {
    display: block;
    word-break: break-all;
    background: var(--bg);
    padding: 8px;
    border-radius: 6px;
    margin: 4px 0;
  }
  .api-box a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <p class="greeting" id="greeting"></p>
    <p class="today" id="today"></p>
  </header>

  <div class="grid">
    <section class="card" id="weather-card">
      <h2>🌤️ 우리 동네 날씨·미세먼지</h2>
      <p class="loading">불러오는 중이에요…</p>
    </section>
    <section class="card" id="rate-card">
      <h2>💱 환율</h2>
      <p class="loading">불러오는 중이에요…</p>
    </section>
    <section class="card" id="holiday-card">
      <h2>📅 다음 공휴일</h2>
      <p class="loading">불러오는 중이에요…</p>
    </section>
    <section class="card" id="dog-card">
      <h2>🐶 오늘의 강아지</h2>
      <p class="loading">불러오는 중이에요…</p>
    </section>
  </div>

  <p class="source">
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
    (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>), 대기질은 CAMS 예측 모델 값
    · 환율: <a href="https://frankfurter.dev/" target="_blank" rel="noopener">Frankfurter</a> (유럽중앙은행이 영업일마다 하루 한 번 발표하는 기준 환율)
    · 공휴일: <a href="https://date.nager.at/" target="_blank" rel="noopener">Nager.Date</a>
    · 강아지 사진: <a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener">Dog CEO</a>
  </p>

  <section class="api-box">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <ul id="api-list"></ul>
  </section>
</main>

<script>
  // ---------- 공통 도우미 ----------
  async function getJson(url) {
    const res = await fetch(url); // 🔌 API 호출
    if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
    return res.json();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function showLoading(card, title) {
    card.innerHTML = `<h2>${title}</h2><p class="loading">불러오는 중이에요…</p>`;
  }

  // 카드 하나만 실패 화면으로 바꿔요. 다른 카드는 그대로예요.
  function showError(card, title, what, err, retry) {
    card.innerHTML = `
      <h2>${title}</h2>
      <div class="error">
        <strong>${what}을(를) 불러오지 못했어요.</strong><br>
        잠시 뒤 다시 시도하거나, 맨 위 🔌 주소가 맞는지 확인해 주세요.<br>
        <small>(${escapeHtml(err.message)})</small><br>
        <button type="button" class="btn">다시 시도</button>
      </div>`;
    card.querySelector(".btn").addEventListener("click", retry);
  }

  const time = (iso) => iso.replace("T", " ");

  // ---------- 인사말 ----------
  function showGreeting() {
    const now = new Date();
    const h = now.getHours();
    let text;
    if (h >= 5 && h < 11) text = "☀️ 좋은 아침이에요! 오늘도 힘차게 시작해요.";
    else if (h >= 11 && h < 17) text = "🍱 점심 맛있게 드셨나요? 오후도 화이팅!";
    else text = "🌙 좋은 저녁이에요. 오늘 하루 수고 많았어요.";
    document.getElementById("greeting").textContent = text;
    document.getElementById("today").textContent =
      now.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" }) + ` · 📍 ${PLACE}`;
  }

  // ---------- 1) 날씨 + 미세먼지 ----------
  const WEATHER_CODES = {
    0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
    45: ["안개", "🌫️"], 48: ["서리 안개", "🌫️"],
    51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌧️"],
    56: ["약한 어는 이슬비", "🌧️"], 57: ["강한 어는 이슬비", "🌧️"],
    61: ["약한 비", "🌦️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
    66: ["약한 어는 비", "🌧️"], 67: ["강한 어는 비", "🌧️"],
    71: ["약한 눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["강한 눈", "❄️"], 77: ["싸락눈", "🌨️"],
    80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["강한 소나기", "⛈️"],
    85: ["약한 눈 소나기", "🌨️"], 86: ["강한 눈 소나기", "❄️"],
    95: ["뇌우", "⛈️"], 96: ["뇌우와 약한 우박", "⛈️"], 99: ["뇌우와 강한 우박", "⛈️"],
  };

  // 한국 환경부 미세먼지 예보 등급 (㎍/㎥)
  const GRADES = {
    pm10:  [[30, "좋음", "good"], [80, "보통", "normal"], [150, "나쁨", "bad"], [Infinity, "매우나쁨", "very-bad"]],
    pm2_5: [[15, "좋음", "good"], [35, "보통", "normal"], [75, "나쁨", "bad"], [Infinity, "매우나쁨", "very-bad"]],
  };
  const grade = (kind, value) => GRADES[kind].find(([max]) => Math.round(value) <= max);

  async function loadWeatherCard() {
    const card = document.getElementById("weather-card");
    const title = "🌤️ 우리 동네 날씨·미세먼지";
    showLoading(card, title);
    // 날씨와 대기질을 따로 받아서, 대기질만 실패해도 기온은 보여요.
    const [w, a] = await Promise.allSettled([getJson(API.weather), getJson(API.air)]);
    if (w.status === "rejected" && a.status === "rejected") {
      showError(card, title, "날씨와 미세먼지", w.reason, loadWeatherCard);
      return;
    }

    let html = `<h2>${title}</h2>`;
    if (w.status === "fulfilled") {
      const c = w.value.current;
      const [text, emoji0] = WEATHER_CODES[c.weather_code] || [`코드 ${c.weather_code}`, "❔"];
      const emoji = !c.is_day && (c.weather_code === 0 || c.weather_code === 1) ? "🌙" : emoji0;
      html += `<div class="big">${emoji} ${Math.round(c.temperature_2m)}${w.value.current_units.temperature_2m}</div>
               <div>${text}</div>
               <p class="basis">기준 시각: ${time(c.time)}</p>`;
    } else {
      html += `<div class="error small">기온을 불러오지 못했어요. (${escapeHtml(w.reason.message)})</div>`;
    }

    html += `<div class="sub">`;
    if (a.status === "fulfilled" && a.value.current.pm10 != null && a.value.current.pm2_5 != null) {
      const c = a.value.current;
      const row = (label, kind, value) => {
        const [, name, cls] = grade(kind, value);
        return `<div class="line"><span>${label} <small>${Math.round(value)}㎍/㎥</small></span><span class="grade ${cls}">${name}</span></div>`;
      };
      html += row("미세먼지", "pm10", c.pm10) + row("초미세먼지", "pm2_5", c.pm2_5)
           + `<p class="basis">기준 시각: ${time(c.time)} · 1시간 모델 값에 환경부 등급을 적용한 참고용</p>`;
    } else {
      const msg = a.status === "rejected" ? a.reason.message : "미세먼지 값이 비어 있어요";
      html += `<div class="error small">미세먼지를 불러오지 못했어요. (${escapeHtml(msg)})</div>`;
    }
    html += `</div>`;
    if (w.status === "rejected" || a.status === "rejected") {
      html += `<button type="button" class="btn">다시 시도</button>`;
    }
    card.innerHTML = html;
    const btn = card.querySelector(".btn");
    if (btn) btn.addEventListener("click", loadWeatherCard);
  }

  // ---------- 2) 환율 ----------
  async function loadRateCard() {
    const card = document.getElementById("rate-card");
    const title = "💱 환율";
    showLoading(card, title);
    try {
      const [usd, jpy] = await Promise.all([getJson(API.usd), getJson(API.jpy)]);
      const won = (n) => n.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      card.innerHTML = `
        <h2>${title}</h2>
        <div class="line"><span>🇺🇸 1달러</span><strong>${won(usd.rates.KRW)}원</strong></div>
        <div class="line"><span>🇯🇵 100엔</span><strong>${won(jpy.rates.KRW)}원</strong></div>
        <p class="basis">기준일: ${usd.date} (ECB 기준 환율, 하루 한 번 발표)</p>`;
    } catch (err) {
      showError(card, title, "환율", err, loadRateCard);
    }
  }

  // ---------- 3) 다음 공휴일 D-day ----------
  async function loadHolidayCard() {
    const card = document.getElementById("holiday-card");
    const title = "📅 다음 공휴일";
    showLoading(card, title);
    try {
      const list = await getJson(API.holiday);
      if (!Array.isArray(list) || list.length === 0) throw new Error("다가오는 공휴일 정보가 없어요");
      const next = list[0];
      // 날짜만 비교하려고 둘 다 자정 기준으로 맞춰요.
      const [y, m, d] = next.date.split("-").map(Number);
      const target = new Date(y, m - 1, d);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.round((target - today) / 86400000);
      const dday = days === 0 ? "D-Day 🎉" : days > 0 ? `D-${days}` : `D+${-days}`;
      const name = next.localName || next.name; // 한국어 이름 우선
      const dateText = target.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
      card.innerHTML = `
        <h2>${title}</h2>
        <div class="big">${dday}</div>
        <div><strong>${escapeHtml(name)}</strong> · ${dateText}</div>
        <p class="basis">기준: 오늘 ${today.toLocaleDateString("ko-KR")} · 대체공휴일은 빠져 있을 수 있어요</p>`;
    } catch (err) {
      showError(card, title, "공휴일", err, loadHolidayCard);
    }
  }

  // ---------- 4) 랜덤 강아지 ----------
  async function loadDogCard() {
    const card = document.getElementById("dog-card");
    const title = "🐶 오늘의 강아지";
    showLoading(card, title);
    try {
      const data = await getJson(API.dog);
      if (data.status !== "success") throw new Error("강아지 사진 주소가 오지 않았어요");
      // 사진 주소 .../breeds/견종이름/파일.jpg 에서 견종 이름을 꺼내요.
      const breed = (data.message.split("/breeds/")[1] || "").split("/")[0].replace("-", " ");
      card.innerHTML = `
        <h2>${title}</h2>
        <img class="dog-img" src="${escapeHtml(data.message)}" alt="랜덤 강아지 사진 (${escapeHtml(breed)})">
        <div class="dog-row">
          <small>${escapeHtml(breed)}</small>
          <button type="button" class="btn">🔄 다른 강아지</button>
        </div>`;
      card.querySelector(".btn").addEventListener("click", loadDogCard);
      card.querySelector("img").addEventListener("error", () =>
        showError(card, title, "강아지 사진", new Error("사진 파일을 열 수 없어요"), loadDogCard)
      );
    } catch (err) {
      showError(card, title, "강아지 사진", err, loadDogCard);
    }
  }

  // ---------- 🔌 API 상자 ----------
  function showApiBox() {
    const labels = {
      weather: "1-1. 날씨 (Open-Meteo)", air: "1-2. 대기질 (Open-Meteo)",
      usd: "2-1. 1달러 환율 (Frankfurter)", jpy: "2-2. 100엔 환율 (Frankfurter)",
      holiday: "3. 다음 공휴일 (Nager.Date)", dog: "4. 랜덤 강아지 (Dog CEO)",
    };
    document.getElementById("api-list").innerHTML = Object.entries(API).map(([key, url]) => `
      <li>${labels[key]}
        <code>${escapeHtml(url)}</code>
        <a href="${escapeHtml(url)}" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기 ↗</a>
      </li>`).join("");
  }

  // 카드 4장은 서로 기다리지 않고 따로 불러요. 하나가 실패해도 나머지는 보여요.
  showGreeting();
  showApiBox();
  loadWeatherCard();
  loadRateCard();
  loadHolidayCard();
  loadDogCard();
</script>
</body>
</html>
