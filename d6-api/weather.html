<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<script>
  // ===== 🔌 이 화면이 쓰는 API (주소는 여기 한 곳에만) =====
  // latitude(위도), longitude(경도) 숫자를 바꾸면 다른 동네 날씨가 나와요.
  const PLACE = "서울 중구 (서울시청)";
  const API = {
    weather: "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day&timezone=Asia%2FSeoul", // 🔌 Open-Meteo 날씨 예보 API (키 필요 없음)
  };
</script>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1d232a;
    --muted: #66717d;
    --line: #dde2e7;
    --accent: #2f6fdf;
    --error-bg: #fdecec;
    --error-text: #a52a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --card: #1e242b;
      --text: #e8ecf0;
      --muted: #9aa5b1;
      --line: #313a44;
      --accent: #7fa8f0;
      --error-bg: #3a2020;
      --error-text: #f3a6a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .place { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
  }
  .now { display: flex; align-items: center; gap: 16px; }
  .emoji { font-size: 4rem; line-height: 1; }
  .temp { font-size: 3rem; font-weight: 700; line-height: 1; }
  .desc { font-size: 1.2rem; margin-top: 6px; }
  .details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 20px 0 0;
    padding: 16px 0 0;
    border-top: 1px solid var(--line);
  }
  .details dt { color: var(--muted); font-size: 0.8rem; }
  .details dd { margin: 0; font-weight: 600; }
  .basis { color: var(--muted); font-size: 0.85rem; margin-top: 16px; }
  .loading { color: var(--muted); }
  .error {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 10px;
    padding: 16px;
  }
  .error button {
    margin-top: 10px;
    padding: 6px 14px;
    border: 1px solid currentColor;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  .source { color: var(--muted); font-size: 0.85rem; margin: 16px 0 0; }
  .source a { color: var(--accent); }
  .api-box {
    margin-top: 28px;
    padding: 16px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    font-size: 0.85rem;
  }
  .api-box h2 { font-size: 0.95rem; margin: 0 0 8px; }
  .api-box code {
    display: block;
    word-break: break-all;
    background: var(--bg);
    padding: 8px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .api-box a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>우리 동네 날씨</h1>
  <p class="place" id="place"></p>

  <section class="card" id="weather-card">
    <p class="loading">날씨를 불러오는 중이에요…</p>
  </section>

  <p class="source">
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
    (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>)
  </p>

  <section class="api-box">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <code id="api-url"></code>
    <a id="api-link" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기 ↗</a>
  </section>
</main>

<script>
  // WMO 날씨 코드 → 한국어 + 이모지 (Open-Meteo 문서의 weather_code 표 기준)
  const WEATHER_CODES = {
    0:  ["맑음", "☀️"],
    1:  ["대체로 맑음", "🌤️"],
    2:  ["구름 조금", "⛅"],
    3:  ["흐림", "☁️"],
    45: ["안개", "🌫️"],
    48: ["서리 안개", "🌫️"],
    51: ["약한 이슬비", "🌦️"],
    53: ["이슬비", "🌦️"],
    55: ["강한 이슬비", "🌧️"],
    56: ["약한 어는 이슬비", "🌧️"],
    57: ["강한 어는 이슬비", "🌧️"],
    61: ["약한 비", "🌦️"],
    63: ["비", "🌧️"],
    65: ["강한 비", "🌧️"],
    66: ["약한 어는 비", "🌧️"],
    67: ["강한 어는 비", "🌧️"],
    71: ["약한 눈", "🌨️"],
    73: ["눈", "🌨️"],
    75: ["강한 눈", "❄️"],
    77: ["싸락눈", "🌨️"],
    80: ["약한 소나기", "🌦️"],
    81: ["소나기", "🌧️"],
    82: ["강한 소나기", "⛈️"],
    85: ["약한 눈 소나기", "🌨️"],
    86: ["강한 눈 소나기", "❄️"],
    95: ["뇌우", "⛈️"],
    96: ["뇌우와 약한 우박", "⛈️"],
    99: ["뇌우와 강한 우박", "⛈️"],
  };

  function describe(code, isDay) {
    const [text, emoji] = WEATHER_CODES[code] || [`알 수 없는 날씨 (코드 ${code})`, "❔"];
    // 밤에 맑으면 해 대신 달
    if (!isDay && (code === 0 || code === 1)) return [text, "🌙"];
    return [text, emoji];
  }

  const card = document.getElementById("weather-card");

  async function loadWeather() {
    card.innerHTML = `<p class="loading">날씨를 불러오는 중이에요…</p>`;
    try {
      const res = await fetch(API.weather); // 🔌 API 호출
      if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
      const data = await res.json();
      const c = data.current;
      if (!c || c.temperature_2m === undefined) throw new Error("응답에 current 값이 없어요");

      const [text, emoji] = describe(c.weather_code, c.is_day === 1);
      const u = data.current_units;
      card.innerHTML = `
        <div class="now">
          <div class="emoji" aria-hidden="true">${emoji}</div>
          <div>
            <div class="temp">${Math.round(c.temperature_2m)}${u.temperature_2m}</div>
            <div class="desc">${text}</div>
          </div>
        </div>
        <dl class="details">
          <div><dt>체감</dt><dd>${Math.round(c.apparent_temperature)}${u.apparent_temperature}</dd></div>
          <div><dt>습도</dt><dd>${c.relative_humidity_2m}${u.relative_humidity_2m}</dd></div>
          <div><dt>바람</dt><dd>${c.wind_speed_10m} ${u.wind_speed_10m}</dd></div>
        </dl>
        <p class="basis">기준 시각: ${c.time.replace("T", " ")} (${data.timezone_abbreviation || data.timezone}) · 15분 간격으로 갱신되는 모델 값이에요</p>
      `;
    } catch (err) {
      card.innerHTML = `
        <div class="error">
          <strong>날씨를 불러오지 못했어요.</strong><br>
          잠시 뒤 다시 시도하거나, 맨 위 🔌 주소가 맞는지 확인해 주세요.<br>
          <small>(${err.message})</small><br>
          <button type="button" onclick="loadWeather()">다시 시도</button>
        </div>
      `;
    }
  }

  document.getElementById("place").textContent = `📍 ${PLACE}`;
  document.getElementById("api-url").textContent = API.weather;
  document.getElementById("api-link").href = API.weather;
  loadWeather();
</script>
</body>
</html>
